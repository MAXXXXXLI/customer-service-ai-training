name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site/data
          cp -R local_app/static/. _site/
          cp knowledge_base/scenario_library.jsonl _site/data/
          cp knowledge_base/rag_documents.jsonl _site/data/
          cp knowledge_base/scoring_rubric.json _site/data/
          cp knowledge_base/customer_service_methodology.json _site/data/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
